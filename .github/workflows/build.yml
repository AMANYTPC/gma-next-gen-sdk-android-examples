name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: java
            path: java/NextGenExample
          - name: kotlin
            path: kotlin/NextGenExample
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up gradle
        uses: gradle/gradle-build-action@v3

      - name: Build ${{ matrix.path }}
        run: |
          echo "Building ${{ matrix.path }}..."
          cd ${{ matrix.path }}
          ./gradlew build --no-daemon

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ matrix.name }}
          # The paths below catch both standard Android APKs and standard Java JARs.
          # You can remove the one you don't need.
          path: |
            ${{ matrix.path }}/app/build/outputs/apk/**/*.apk
            ${{ matrix.path }}/build/libs/*.jar
